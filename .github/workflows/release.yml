name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag is vMAJOR.MINOR.PATCH
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3 (minor and patch below 100)"
            exit 1
          fi
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.INSTASAVED_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret INSTASAVED_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "INSTASAVED_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          INSTASAVED_KEYSTORE_PASSWORD: ${{ secrets.INSTASAVED_KEYSTORE_PASSWORD }}
          INSTASAVED_KEY_ALIAS: ${{ secrets.INSTASAVED_KEY_ALIAS }}
          INSTASAVED_KEY_PASSWORD: ${{ secrets.INSTASAVED_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease -PappVersion="$APP_VERSION"

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "instasaved-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "instasaved-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --generate-notes
